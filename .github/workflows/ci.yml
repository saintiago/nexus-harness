name: CI

# A push outside `task/**`, and nothing else. A `pull_request` trigger does not
# work in this repository: the pull request is opened by the task-branch
# workflow's own token, GitHub holds the run that starts for a maintainer's
# approval, and the merge then deletes the branch and the run expires unapproved
# — a failed run that never validated anything (docs/GIT-WORKFLOW.md).
on:
  push:
    branches-ignore:
      - 'task/**'

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Use the declared Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format, lint, typecheck, test, and build
        run: npm run validate
