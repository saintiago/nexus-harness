name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Restore deterministic check results
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node24-turbo-v1-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node24-turbo-v1-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: npm run validate
      - run: npm run smoke:help
