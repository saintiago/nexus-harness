name: Task branch

# One task, one `task/<name>` branch, merged into `main` through a pull request â€” the
# loop docs/GIT-WORKFLOW.md describes, run without a person: open the pull request,
# run the gate, and merge only when the gate passed.
#
# Branch protection is not available for this repository, so no check can be made
# *required* and `gh pr merge --auto` would have nothing to wait for. This workflow
# is the gate instead: the merge step runs only after `npm run validate` passed.

on:
  push:
    branches:
      - 'task/**'

# The repository's default for GITHUB_TOKEN is read-only, so the permissions this
# needs are asked for here, and nowhere else: writes to merge and to delete the
# branch, and pull-request writes to open the pull request.
permissions:
  contents: write
  pull-requests: write

concurrency:
  # One run per branch: a second push waits for the first rather than merging
  # beside it.
  group: task-branch-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  merge:
    name: validate and merge
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # `gh pr create --fill` reads the branch's commits back to the base, so
          # the checkout has to hold them: a shallow one has no `origin/main` and
          # the command fails before it opens anything.
          fetch-depth: 0

      - name: Use the declared Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A red gate ends the run here, before anything is merged: the branch stays
      # pushed, the pull request stays open, and `main` is untouched.
      - name: Format, lint, typecheck, test, and build
        run: npm run validate

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[].number')" ]; then
            gh pr create --fill --base main --head "$GITHUB_REF_NAME"
          fi

      # A branch cut before an earlier task merged changes the same files, and the
      # merge then refuses it. That is the one case this workflow repairs itself:
      # rebase the branch here and push it, so the push starts the run that
      # validates the rebased commit and merges it. A rebase that conflicts is a
      # person's job, and the failure says so.
      - name: Rebase when the pull request conflicts with main
        id: rebase
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The status is computed when the pull request is read, and is unknown
          # for a moment after one is opened: wait for a real answer.
          state=""
          for attempt in 1 2 3 4 5 6; do
            state="$(gh pr view "$GITHUB_REF_NAME" --json mergeStateStatus --jq .mergeStateStatus)"
            if [ "$state" != "UNKNOWN" ]; then
              break
            fi
            sleep 10
          done
          if [ "$state" != "DIRTY" ]; then
            echo "the pull request is ${state}: nothing to rebase"
            exit 0
          fi
          git config user.name "nexus-harness"
          git config user.email "nexus-harness@users.noreply.github.com"
          git fetch --quiet origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::this branch conflicts with main and cannot be rebased here; rebase it by hand"
            exit 1
          fi
          git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"
          echo "rebased=true" >> "$GITHUB_OUTPUT"

      - name: Merge it into main
        # A run that rebased the branch stops here: the push above starts the run
        # that validates the rebased commit and merges that one instead.
        if: steps.rebase.outputs.rebased != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "$GITHUB_REF_NAME" --squash --delete-branch
